{% extends "base/base.html" %}
{% block title %}Mapa de Calor - Capacidad{% endblock %}
{% block content %}
{% include "capacity/_nav_tabs.html" %}

<div class="card bg-base-100 shadow-sm border border-base-300/30">
  <div class="card-body">
    <div id="heatmap-chart" style="height:500px;"></div>
  </div>
</div>

<div class="mt-4 flex flex-wrap gap-3 text-xs opacity-70">
  <span class="flex items-center gap-1"><span class="w-4 h-3 rounded bg-success/30 inline-block"></span> Bajo (&lt;20h)</span>
  <span class="flex items-center gap-1"><span class="w-4 h-3 rounded bg-info/50 inline-block"></span> Normal (20-35h)</span>
  <span class="flex items-center gap-1"><span class="w-4 h-3 rounded bg-warning/50 inline-block"></span> Alto (35-40h)</span>
  <span class="flex items-center gap-1"><span class="w-4 h-3 rounded bg-error/70 inline-block"></span> Sobrecargado (&gt;40h)</span>
</div>
{% endblock %}

{% block extra_js %}
<script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
<script>
  fetch("{% url 'capacity:heatmap' %}", { headers: { 'Accept': 'application/json' } })
    .then(r => r.json())
    .then(data => {
      if (!data.weeks.length) {
        document.getElementById('heatmap-chart').innerHTML = '<div class="text-center py-16 text-base-content/50">No hay datos de asignacion para mostrar.</div>';
        return;
      }
      const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
      const textColor = isDark ? '#a6adbb' : '#374151';
      const caps = data.capacities || [];
      const chart = echarts.init(document.getElementById('heatmap-chart'));

      // Mark current week
      const now = new Date();
      const dayOfWeek = now.getDay() || 7;
      const monday = new Date(now);
      monday.setDate(now.getDate() - dayOfWeek + 1);
      const currentWeekLabel = monday.toLocaleDateString('es', {day:'2-digit', month:'short'});

      chart.setOption({
        tooltip: {
          position: 'top',
          formatter: function(params) {
            const user = data.users[params.value[1]];
            const week = data.weeks[params.value[0]];
            const hours = params.value[2];
            const cap = caps[params.value[1]] || 40;
            const pct = Math.round(hours / cap * 100);
            const status = hours > cap ? '<span style="color:#ef4444">SOBRECARGA</span>' :
                           hours > cap * 0.85 ? '<span style="color:#f59e0b">ALTO</span>' :
                           '<span style="color:#22c55e">OK</span>';
            return `<b>${user}</b><br>Semana ${week}<br>${hours}h / ${cap}h (${pct}%)<br>${status}`;
          }
        },
        grid: { top: 30, bottom: 70, left: 140, right: 20 },
        xAxis: {
          type: 'category',
          data: data.weeks,
          splitArea: { show: true },
          axisLabel: {
            rotate: 45,
            color: textColor,
            fontSize: 11,
            fontWeight: function(value) { return value === currentWeekLabel ? 'bold' : 'normal'; }
          }
        },
        yAxis: {
          type: 'category',
          data: data.users,
          splitArea: { show: true },
          axisLabel: { color: textColor, fontSize: 12 }
        },
        visualMap: {
          min: 0, max: 60, calculable: true,
          orient: 'horizontal', left: 'center', bottom: 5,
          textStyle: { color: textColor },
          inRange: {
            color: isDark
              ? ['#1e293b', '#22d3ee', '#22c55e', '#f59e0b', '#ef4444']
              : ['#f0fdf4', '#86efac', '#fbbf24', '#f87171', '#dc2626']
          },
          text: ['60h+', '0h']
        },
        series: [{
          type: 'heatmap',
          data: data.values,
          label: {
            show: true,
            fontSize: 11,
            fontFamily: 'monospace',
            formatter: function(p) { return p.value[2] + 'h'; },
            color: function(params) {
              return params.value[2] > 40 ? '#fff' : textColor;
            }
          },
          emphasis: {
            itemStyle: { shadowBlur: 10, shadowColor: 'rgba(0,0,0,0.3)' }
          }
        }]
      });
      window.addEventListener('resize', () => chart.resize());
    })
    .catch(() => {
      document.getElementById('heatmap-chart').innerHTML = '<div class="text-center py-16 text-base-content/50">Error al cargar los datos del mapa de calor.</div>';
    });
</script>
{% endblock %}
