{% extends "base/base.html" %}
{% block title %}Eliminar País{% endblock %}
{% block content %}
<div class="max-w-md mx-auto mt-10">
  <div class="card bg-base-100 shadow border border-error/30">
    <div class="card-body">
      <h2 class="card-title text-error">¿Eliminar "{{ object.name }}"?</h2>
      <p class="text-sm text-base-content/70">Esta acción no se puede deshacer. Los proyectos con este país perderán la referencia.</p>
      <form method="post" class="flex justify-end gap-3 mt-4">
        {% csrf_token %}
        <a href="{% url 'geography:country_list' %}" class="btn btn-ghost">Cancelar</a>
        <button type="submit" class="btn btn-error">Eliminar</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
