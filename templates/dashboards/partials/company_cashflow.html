<div class="card bg-base-100 shadow-sm border border-base-300/30 mb-8">
  <div class="card-body">
    <div class="flex items-center justify-between">
      <h2 class="card-title text-base">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
        Flujo de Caja (Empresa)
      </h2>
      <div x-data="{ view: 'company' }" class="flex gap-1">
        <button @click="view='company'; loadCompanyCashflow()" class="btn btn-xs" :class="view==='company' ? 'btn-primary' : 'btn-ghost'">Empresa</button>
        {% for bu in business_units %}
        <button @click="view='{{ bu.code }}'; loadBUCashflow('{{ bu.code }}')" class="btn btn-xs" :class="view==='{{ bu.code }}' ? 'btn-primary' : 'btn-ghost'">{{ bu.name }}</button>
        {% endfor %}
      </div>
    </div>
    <div id="company-cashflow-chart" style="height: 300px;"></div>
  </div>
</div>

<script>
function renderCashflowChart(data) {
  const colors = getChartColors();
  const container = document.getElementById('company-cashflow-chart');
  let chart = echarts.getInstanceByDom(container);
  if (!chart) chart = echarts.init(container);
  chart.setOption({
    tooltip: { trigger: 'axis' },
    legend: { data: ['Proyectado', 'Facturado', 'Recaudado'], textStyle: { color: colors.textColor } },
    xAxis: { type: 'category', data: data.periods, axisLabel: { color: colors.textColor }, axisLine: { lineStyle: { color: colors.lineColor } } },
    yAxis: { type: 'value', axisLabel: { formatter: v => '$' + (v/1e6).toFixed(1) + 'M', color: colors.textColor }, splitLine: { lineStyle: { color: colors.lineColor } } },
    series: [
      { name: 'Proyectado', type: 'bar', data: data.projected, itemStyle: { color: '#3b82f6' } },
      { name: 'Facturado', type: 'bar', data: data.invoiced, itemStyle: { color: '#eab308' } },
      { name: 'Recaudado', type: 'bar', data: data.collected, itemStyle: { color: '#22c55e' } },
    ]
  }, true);
  window.addEventListener('resize', () => chart.resize());
}

function loadCompanyCashflow() {
  fetch("{% url 'dashboards:company_cashflow' %}").then(r => r.json()).then(renderCashflowChart);
}

function loadBUCashflow(code) {
  fetch(`/dashboards/api/cashflow-bu/${code}/`).then(r => r.json()).then(renderCashflowChart);
}

document.addEventListener('DOMContentLoaded', loadCompanyCashflow);
</script>
