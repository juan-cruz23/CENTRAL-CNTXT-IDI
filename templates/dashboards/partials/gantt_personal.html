{% comment %}
Gantt personal — servicios del cronograma asignados al usuario.
Requiere: padre con x-data="ganttData(...)" definido en home.html.
{% endcomment %}

<div x-show="showGantt"
     x-transition:enter="transition ease-out duration-200"
     x-transition:enter-start="opacity-0"
     x-transition:enter-end="opacity-100"
     x-transition:leave="transition ease-in duration-150"
     x-transition:leave-start="opacity-100"
     x-transition:leave-end="opacity-0"
     class="mb-8 rounded-2xl overflow-hidden"
     style="background:#080808; border:1px solid rgba(255,255,255,0.07);">

  <!-- ── Header ─────────────────────────────────────────────── -->
  <div class="flex items-center justify-between px-6 py-4"
       style="border-bottom:1px solid rgba(255,255,255,0.06);">

    <!-- Título + conteo -->
    <div class="flex items-center gap-3">
      <svg class="h-4 w-4 shrink-0" style="color:rgba(200,168,122,0.6);" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.7"
              d="M9 17V7m0 10a2 2 0 01-2 2H5a2 2 0 01-2-2V7a2 2 0 012-2h2a2 2 0 012 2m0 10a2 2 0 002 2h2a2 2 0 002-2M9 7a2 2 0 012-2h2a2 2 0 012 2m0 10V7m0 10a2 2 0 002 2h2a2 2 0 002-2V7a2 2 0 00-2-2h-2a2 2 0 00-2 2"/>
      </svg>
      <p style="font-family:'Inter',sans-serif; font-size:0.7rem; font-weight:600;
                color:rgba(255,255,255,0.4); letter-spacing:0.12em; text-transform:uppercase;">
        Mi Cronograma
      </p>
      <span style="font-family:'Inter',sans-serif; font-size:0.65rem; color:rgba(255,255,255,0.18);"
            x-text="items.length + ' servicio' + (items.length !== 1 ? 's' : '')"></span>
    </div>

    <!-- Controles -->
    <div class="flex items-center gap-3 flex-wrap justify-end">

      <!-- Zoom presets -->
      <div class="flex items-center gap-1" style="background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.07); border-radius:8px; padding:2px;">
        <template x-for="preset in [{d:14,l:'2 sem'},{d:30,l:'1 mes'},{d:90,l:'3 mes'},{d:180,l:'6 mes'}]" :key="preset.d">
          <button @click="zoomTo(preset.d)"
                  :style="zoom === preset.d
                    ? 'background:rgba(200,168,122,0.2); color:#C8A87A; border:1px solid rgba(200,168,122,0.3);'
                    : 'background:none; color:rgba(255,255,255,0.3); border:1px solid transparent;'"
                  style="font-family:'Inter',sans-serif; font-size:0.62rem; font-weight:600;
                         cursor:pointer; padding:3px 9px; border-radius:6px; transition:all 0.15s;"
                  x-text="preset.l">
          </button>
        </template>
      </div>

      <!-- Navegación pan -->
      <div class="flex items-center gap-1">
        <button @click="panLeft()"
                style="width:26px; height:26px; border-radius:7px; border:1px solid rgba(255,255,255,0.08);
                       background:rgba(255,255,255,0.03); color:rgba(255,255,255,0.4); cursor:pointer;
                       display:flex; align-items:center; justify-content:center;"
                onmouseover="this.style.borderColor='rgba(200,168,122,0.3)'"
                onmouseout="this.style.borderColor='rgba(255,255,255,0.08)'">
          <svg class="h-3 w-3" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/>
          </svg>
        </button>
        <button @click="resetPan()"
                style="font-family:'Inter',sans-serif; font-size:0.62rem; font-weight:600;
                       padding:3px 10px; border-radius:7px; border:1px solid rgba(255,255,255,0.08);
                       background:rgba(255,255,255,0.03); color:rgba(255,255,255,0.4); cursor:pointer;"
                onmouseover="this.style.color='#C8A87A'; this.style.borderColor='rgba(200,168,122,0.3)'"
                onmouseout="this.style.color='rgba(255,255,255,0.4)'; this.style.borderColor='rgba(255,255,255,0.08)'">
          Hoy
        </button>
        <button @click="panRight()"
                style="width:26px; height:26px; border-radius:7px; border:1px solid rgba(255,255,255,0.08);
                       background:rgba(255,255,255,0.03); color:rgba(255,255,255,0.4); cursor:pointer;
                       display:flex; align-items:center; justify-content:center;"
                onmouseover="this.style.borderColor='rgba(200,168,122,0.3)'"
                onmouseout="this.style.borderColor='rgba(255,255,255,0.08)'">
          <svg class="h-3 w-3" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/>
          </svg>
        </button>
      </div>

      <!-- Leyenda + cerrar -->
      <div class="flex items-center gap-3">
        <span class="flex items-center gap-1.5" style="font-family:'Inter',sans-serif; font-size:0.62rem; color:rgba(255,255,255,0.25);">
          <span style="display:inline-block; width:10px; height:10px; border-radius:3px; background:rgba(200,168,122,0.7);"></span>
          Servicio
        </span>
        <span class="flex items-center gap-1.5" style="font-family:'Inter',sans-serif; font-size:0.62rem; color:rgba(255,255,255,0.25);">
          <span style="display:inline-block; width:2px; height:10px; background:rgba(248,113,113,0.8);"></span>
          Hoy
        </span>
        <button @click="showGantt=false"
                style="font-family:'Inter',sans-serif; font-size:0.72rem; color:rgba(255,255,255,0.25);
                       background:none; border:none; cursor:pointer; padding:4px 8px; border-radius:6px;"
                onmouseover="this.style.color='rgba(255,255,255,0.6)'"
                onmouseout="this.style.color='rgba(255,255,255,0.25)'">
          ✕ Cerrar
        </button>
      </div>
    </div>
  </div>

  <!-- ── Sin datos ────────────────────────────────────────── -->
  <template x-if="!items.length">
    <div class="flex flex-col items-center justify-center py-16 gap-3">
      <svg class="h-10 w-10" style="color:rgba(255,255,255,0.07);" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1" d="M9 17V7m0 10a2 2 0 01-2 2H5a2 2 0 01-2-2V7a2 2 0 012-2h2a2 2 0 012 2m0 10a2 2 0 002 2h2a2 2 0 002-2M9 7a2 2 0 012-2h2a2 2 0 012 2m0 10V7"/>
      </svg>
      <p style="font-family:'Inter',sans-serif; font-size:0.85rem; color:rgba(255,255,255,0.2);">
        Sin servicios asignados en el período visible.
      </p>
    </div>
  </template>

  <!-- ── Gantt chart ─────────────────────────────────────── -->
  <template x-if="items.length">
    <div class="p-6" style="overflow-x:auto;">

      <!-- Eje de tiempo -->
      <div style="display:flex; margin-bottom:6px; padding-left:220px;">
        <div style="position:relative; flex:1; height:20px;">
          <template x-for="tick in ticks" :key="tick.pct">
            <span :style="`
              position:absolute;
              left:${tick.pct}%;
              font-family:'Inter',sans-serif;
              font-size:0.58rem;
              color:rgba(255,255,255,0.2);
              letter-spacing:0.04em;
              white-space:nowrap;
              transform:translateX(-50%);
            `" x-text="tick.label"></span>
          </template>
        </div>
      </div>

      <!-- Línea separadora -->
      <div style="height:1px; background:rgba(255,255,255,0.04); margin-bottom:10px; margin-left:220px;"></div>

      <!-- Grupos por proyecto -->
      <template x-for="proj in projects" :key="proj.code">
        <div style="margin-bottom:14px;">

          <!-- Cabecera proyecto -->
          <div style="display:flex; align-items:center; gap:8px; margin-bottom:5px;">
            <span style="font-family:'Inter',sans-serif; font-size:0.6rem; font-weight:700;
                          color:rgba(200,168,122,0.55); letter-spacing:0.1em; text-transform:uppercase;"
                  x-text="proj.code"></span>
            <span style="font-family:'Inter',sans-serif; font-size:0.68rem; color:rgba(255,255,255,0.28);"
                  x-text="proj.name"></span>
            <div style="flex:1; height:1px; background:rgba(255,255,255,0.04);"></div>
          </div>

          <!-- Filas de servicios -->
          <template x-for="item in proj.items" :key="item.id">
            <div style="margin-bottom:3px;">

              <!-- Fila principal: etiqueta + pista -->
              <div style="display:flex; align-items:center; height:34px;">

                <!-- Etiqueta + botón expand -->
                <div style="width:220px; min-width:220px; padding-right:12px; overflow:hidden; display:flex; align-items:center; gap:6px;">
                  <p x-text="item.name"
                     :title="item.name"
                     style="font-family:'Inter',sans-serif; font-size:0.7rem;
                            color:rgba(255,255,255,0.5); white-space:nowrap;
                            overflow:hidden; text-overflow:ellipsis; flex:1; min-width:0;"></p>

                  <!-- Botón ver/ocultar acciones -->
                  <button @click.stop="expandService(item)"
                          :title="expanded[String(item.id)] ? 'Ocultar acciones' : 'Ver y checkear acciones'"
                          :style="expanded[String(item.id)]
                            ? 'color:#C8A87A; background:rgba(200,168,122,0.12); border-color:rgba(200,168,122,0.3);'
                            : 'color:rgba(255,255,255,0.3); background:rgba(255,255,255,0.04); border-color:rgba(255,255,255,0.1);'"
                          style="flex-shrink:0; width:20px; height:20px; border-radius:5px;
                                 border:1px solid; cursor:pointer;
                                 display:flex; align-items:center; justify-content:center;
                                 transition:all 0.15s; padding:0;">
                    <svg :style="expanded[String(item.id)] ? 'transform:rotate(180deg)' : ''"
                         style="width:10px; height:10px; transition:transform 0.2s;"
                         fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                      <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"/>
                    </svg>
                  </button>
                </div>

                <!-- Pista -->
                <div style="position:relative; flex:1; height:28px; background:rgba(255,255,255,0.03); border-radius:6px;">

                  <!-- Barra del servicio -->
                  <div :style="barStyle(item.start, item.end) + `
                    background:linear-gradient(90deg,rgba(200,168,122,0.8),rgba(200,168,122,0.5));
                    cursor:pointer;
                  `"
                       @mouseenter="showTooltip(item, $event)"
                       @mouseleave="hideTooltip()"
                       @mousemove="tooltip.x = $event.clientX + 14; tooltip.y = $event.clientY - 10">

                    <!-- Relleno de progreso -->
                    <div :style="`
                      position:absolute; top:0; left:0; height:100%;
                      width:${item.progress}%;
                      background:rgba(200,168,122,0.45);
                      border-radius:5px 0 0 5px;
                    `"></div>

                    <!-- % texto -->
                    <span x-show="item.progress > 10"
                          style="position:absolute; right:5px; top:50%;
                                 transform:translateY(-50%);
                                 font-family:'Inter',sans-serif; font-size:0.55rem; font-weight:600;
                                 color:rgba(0,0,0,0.65); pointer-events:none;"
                          x-text="item.progress + '%'"></span>
                  </div>

                  <!-- Marcador Hoy -->
                  <div x-show="todayPct() >= 0 && todayPct() <= 100"
                       :style="`
                         position:absolute; top:0; bottom:0;
                         left:${todayPct()}%;
                         width:1.5px;
                         background:rgba(248,113,113,0.75);
                         box-shadow:0 0 4px rgba(248,113,113,0.4);
                         pointer-events:none;
                       `"></div>

                </div>
              </div>

              <!-- Panel de acciones — se despliega al hacer clic en ▾ -->
              <div x-show="expanded[String(item.id)]"
                   :id="`gantt-actions-${item.id}`"
                   x-transition:enter="transition ease-out duration-150"
                   x-transition:enter-start="opacity-0"
                   x-transition:enter-end="opacity-100"
                   style="margin-left:220px; margin-top:4px; margin-bottom:8px;
                          border-left:2px solid rgba(200,168,122,0.25);
                          padding-left:12px; padding-bottom:4px;
                          background:rgba(200,168,122,0.03);
                          border-radius:0 6px 6px 0;">
                <!-- Contenido cargado via fetch + htmx.process() -->
              </div>

            </div>
          </template>

        </div>
      </template>

    </div>
  </template>

  <!-- ── Tooltip ─────────────────────────────────────────── -->
  <div x-show="tooltip.show"
       :style="`position:fixed; left:${tooltip.x}px; top:${tooltip.y}px; z-index:9999;
                pointer-events:none;`"
       x-cloak>
    <div style="background:#161616; border:1px solid rgba(255,255,255,0.12); border-radius:10px;
                padding:10px 14px; min-width:200px; box-shadow:0 8px 32px rgba(0,0,0,0.6);">
      <p x-text="tooltip.name"
         style="font-family:'Inter',sans-serif; font-size:0.75rem; font-weight:600;
                color:rgba(255,255,255,0.85); margin-bottom:8px; line-height:1.3;
                max-width:220px; white-space:normal;"></p>
      <div style="display:flex; flex-direction:column; gap:4px;">
        <div class="flex items-center justify-between gap-6">
          <span style="font-family:'Inter',sans-serif; font-size:0.62rem; color:rgba(255,255,255,0.35);">Inicio</span>
          <span x-text="tooltip.start"
                style="font-family:'Inter',sans-serif; font-size:0.68rem; color:rgba(255,255,255,0.75); font-weight:500;"></span>
        </div>
        <div class="flex items-center justify-between gap-6">
          <span style="font-family:'Inter',sans-serif; font-size:0.62rem; color:rgba(255,255,255,0.35);">Fin</span>
          <span x-text="tooltip.end"
                style="font-family:'Inter',sans-serif; font-size:0.68rem; color:rgba(255,255,255,0.75); font-weight:500;"></span>
        </div>
        <div style="height:1px; background:rgba(255,255,255,0.07); margin:2px 0;"></div>
        <div class="flex items-center justify-between gap-6">
          <span style="font-family:'Inter',sans-serif; font-size:0.62rem; color:rgba(255,255,255,0.35);">Duración</span>
          <span x-text="tooltip.duration + ' día' + (tooltip.duration !== 1 ? 's' : '')"
                style="font-family:'Inter',sans-serif; font-size:0.68rem; color:#C8A87A; font-weight:600;"></span>
        </div>
      </div>
    </div>
  </div>

</div>
