{% extends "base/base.html" %}
{% block title %}Eliminar {{ object_type }}{% endblock %}
{% block breadcrumb %}
<div class="breadcrumbs text-sm mb-4">
  <ul>
    <li><a href="{{ cancel_url }}">{{ parent_label }}</a></li>
    <li>Eliminar</li>
  </ul>
</div>
{% endblock %}
{% block content %}
<div class="max-w-lg mx-auto">
  <div class="card bg-base-100 shadow-sm border border-base-300/50">
    <div class="card-body text-center">
      <div class="text-error mb-4">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-16 w-16 mx-auto" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126zM12 15.75h.007v.008H12v-.008z" /></svg>
      </div>
      <h2 class="text-xl font-bold mb-2">Confirmar Eliminación</h2>
      <p class="text-base-content/70 mb-6">{{ confirm_message }}</p>
      <form method="post">
        {% csrf_token %}
        <div class="flex justify-center gap-3">
          <a href="{{ cancel_url }}" class="btn btn-ghost">Cancelar</a>
          <button type="submit" class="btn btn-error">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg>
            Eliminar
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
