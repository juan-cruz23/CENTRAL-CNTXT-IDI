{% extends "base/base.html" %}
{% block title %}Eliminar Subcategoría CC{% endblock %}
{% block content %}
{% include "components/page_header.html" with title="Eliminar Subcategoría" %}
<div class="card bg-base-100 shadow-sm border border-base-300/30 max-w-md">
  <div class="card-body">
    <p>¿Eliminar <strong>{{ object }}</strong>?</p>
    <form method="post" class="flex gap-2 mt-4">
      {% csrf_token %}
      <button type="submit" class="btn btn-error btn-sm">Eliminar</button>
      <a href="{% url 'financials:cost_center_subcategory_list' %}" class="btn btn-ghost btn-sm">Cancelar</a>
    </form>
  </div>
</div>
{% endblock %}
