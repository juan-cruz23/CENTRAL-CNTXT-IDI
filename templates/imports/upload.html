{% extends "base/base.html" %}
{% block title %}Subir Archivo{% endblock %}
{% block content %}
<h1 class="text-2xl font-bold mb-6">Subir Archivo CSV</h1>
<div class="card bg-base-100 shadow-xl max-w-2xl">
  <div class="card-body">
    <form method="post" enctype="multipart/form-data">
      {% csrf_token %}
      {% for field in form %}
      <div class="form-control mb-4">
        <label class="label"><span class="label-text">{{ field.label }}</span></label>
        {{ field }}
      </div>
      {% endfor %}
      <button type="submit" class="btn btn-primary">Subir y Previsualizar</button>
    </form>
  </div>
</div>
{% endblock %}
