{% extends "base/base.html" %}
{% block title %}Nuevo Cliente{% endblock %}
{% block content %}
<h1 class="text-2xl font-bold mb-6">Nuevo Cliente</h1>
<div class="card bg-base-100 shadow-xl max-w-2xl">
  <div class="card-body">
    <form method="post">
      {% csrf_token %}
      {% for field in form %}
      <div class="form-control mb-4">
        <label class="label"><span class="label-text">{{ field.label }}</span></label>
        {{ field }}
        {% if field.errors %}<span class="text-error text-sm">{{ field.errors.0 }}</span>{% endif %}
      </div>
      {% endfor %}
      <div class="flex gap-2 mt-4">
        <button type="submit" class="btn btn-primary">Guardar</button>
        <a href="{% url 'projects:client_list' %}" class="btn btn-ghost">Cancelar</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
