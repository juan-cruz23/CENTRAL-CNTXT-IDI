<tr id="scope-form-row">
  <td colspan="5">
    <form hx-post="{% url 'projects:scope_create' project.pk %}"
          hx-target="#scope-form-row"
          hx-swap="outerHTML"
          class="flex flex-wrap items-end gap-2 py-2">
      {% csrf_token %}
      <div class="form-control flex-1 min-w-48">
        <label class="label py-0"><span class="label-text text-xs">Nombre *</span></label>
        <input type="text" name="name" class="input input-bordered input-sm w-full" placeholder="Ej. Estudio de impacto ambiental" required />
      </div>
      <div class="form-control w-36">
        <label class="label py-0"><span class="label-text text-xs">Valor</span></label>
        <input type="number" name="value" step="0.01" min="0" class="input input-bordered input-sm w-full" placeholder="0.00" />
      </div>
      <div class="form-control w-40">
        <label class="label py-0"><span class="label-text text-xs">Estado</span></label>
        <select name="status" class="select select-bordered select-sm w-full">
          <option value="PENDING">Pendiente</option>
          <option value="IN_PROGRESS">En ejecución</option>
          <option value="DELIVERED">Entregado</option>
        </select>
      </div>
      <div class="flex gap-1 self-end">
        <button type="submit" class="btn btn-primary btn-sm">Guardar</button>
        <button type="button" class="btn btn-ghost btn-sm" onclick="this.closest('tr').remove()">Cancelar</button>
      </div>
      {% if form.errors %}
      <div class="text-error text-xs w-full">
        {% for field, errors in form.errors.items %}{{ errors.0 }}{% endfor %}
      </div>
      {% endif %}
    </form>
  </td>
</tr>
