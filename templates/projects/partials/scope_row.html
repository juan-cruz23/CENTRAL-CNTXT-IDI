{% load common_tags %}
<tr id="scopes-empty-state" hx-swap-oob="outerHTML"></tr>
<tr id="scope-{{ scope.pk }}">
  <td class="font-medium">{{ scope.name }}</td>
  <td class="text-base-content/70 text-sm">{{ scope.description|truncatewords:10|default:"-" }}</td>
  <td>
    {% if scope.status == 'PENDING' %}
    <span class="badge badge-warning badge-sm">Pendiente</span>
    {% elif scope.status == 'IN_PROGRESS' %}
    <span class="badge badge-info badge-sm">En ejecución</span>
    {% else %}
    <span class="badge badge-success badge-sm">Entregado</span>
    {% endif %}
  </td>
  <td class="text-right font-mono text-sm">
    {% if scope.value %}{{ scope.value|cop_format }}{% else %}-{% endif %}
  </td>
  <td class="text-right">
    <button class="btn btn-ghost btn-xs"
            hx-get="{% url 'projects:scope_edit' project.pk scope.pk %}"
            hx-target="#scope-{{ scope.pk }}"
            hx-swap="outerHTML">Editar</button>
    <button class="btn btn-ghost btn-xs text-error"
            hx-delete="{% url 'projects:scope_delete' project.pk scope.pk %}"
            hx-target="#scope-{{ scope.pk }}"
            hx-swap="outerHTML"
            hx-confirm="¿Eliminar este alcance?">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M9 2a1 1 0 00-.894.553L7.382 4H4a1 1 0 000 2v10a2 2 0 002 2h8a2 2 0 002-2V6a1 1 0 100-2h-3.382l-.724-1.447A1 1 0 0011 2H9zM7 8a1 1 0 012 0v6a1 1 0 11-2 0V8zm5-1a1 1 0 00-1 1v6a1 1 0 102 0V8a1 1 0 00-1-1z" clip-rule="evenodd"/></svg>
    </button>
  </td>
</tr>
