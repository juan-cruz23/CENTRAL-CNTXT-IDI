{% if field %}
<div class="form-control {% if span == 2 %}md:col-span-2{% endif %}">
  <label class="label" for="{{ field.id_for_label }}">
    <span class="label-text font-medium">{{ field.label }}{% if field.field.required %} <span class="text-error">*</span>{% endif %}</span>
  </label>
  {{ field }}
  {% if field.help_text %}<span class="label-text-alt text-base-content/60 mt-1">{{ field.help_text }}</span>{% endif %}
  {% if field.errors %}<span class="label-text-alt text-error mt-1">{{ field.errors.0 }}</span>{% endif %}
</div>
{% endif %}
