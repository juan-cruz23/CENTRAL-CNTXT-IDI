{% extends "base/base.html" %}
{% block title %}Iniciar Sesión{% endblock %}
{% block content %}
<div class="flex items-center justify-center min-h-[80vh]">
  <div class="card w-96 bg-base-100 shadow-xl">
    <div class="card-body">
      <h2 class="card-title text-2xl font-bold text-center w-full">CNTXT Central</h2>
      <p class="text-center text-base-content/60">Gestión de Proyectos</p>
      <form method="post" class="mt-4">
        {% csrf_token %}
        <div class="form-control mb-4">
          <label class="label"><span class="label-text">Usuario</span></label>
          <input type="text" name="username" class="input input-bordered" required autofocus />
        </div>
        <div class="form-control mb-6">
          <label class="label"><span class="label-text">Contraseña</span></label>
          <input type="password" name="password" class="input input-bordered" required />
        </div>
        {% if form.errors %}
        <div class="alert alert-error mb-4">
          <span>Usuario o contraseña incorrectos.</span>
        </div>
        {% endif %}
        <button type="submit" class="btn btn-primary w-full">Ingresar</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
