{% extends "base/base.html" %}
{% block title %}Fases de Proyecto{% endblock %}
{% block content %}
<h1 class="text-2xl font-bold mb-6">Fases de Proyecto</h1>
<div class="card bg-base-100 shadow-xl">
  <div class="card-body p-0">
    <table class="table table-zebra">
      <thead><tr><th>#</th><th>Fase</th><th>Descripción</th></tr></thead>
      <tbody>
        {% for phase in phases %}
        <tr>
          <td class="font-mono font-bold">{{ phase.number }}</td>
          <td>{{ phase.name }}</td>
          <td>{{ phase.description|default:"-" }}</td>
        </tr>
        {% empty %}
        <tr><td colspan="3" class="text-center py-8">No hay fases definidas.</td></tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
</div>
{% endblock %}
