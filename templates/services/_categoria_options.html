<label class="label pb-1"><span class="label-text font-medium">Categoría <span class="text-error">*</span></span></label>
<select name="category" id="id_category" class="select select-bordered w-full">
  <option value="">---------</option>
  {% for cat in categories %}
  <option value="{{ cat.pk }}" {% if selected_cat == cat.pk|stringformat:"s" %}selected{% endif %}>{{ cat }}</option>
  {% endfor %}
</select>

<div id="subcategoria-wrapper" class="form-control" hx-swap-oob="outerHTML">
  <label class="label pb-1"><span class="label-text font-medium">Sub categoría</span></label>
  <select name="subcategory" id="id_subcategory" class="select select-bordered w-full">
    <option value="">---------</option>
    {% for sub in subcategories %}
    <option value="{{ sub.pk }}" {% if selected_sub == sub.pk|stringformat:"s" %}selected{% endif %}>{{ sub }}</option>
    {% endfor %}
  </select>
</div>
