{% load humanize %}
<tr id="st-row-{{ st.pk }}" class="hover">
  <td class="font-mono font-bold text-sm">{{ st.code }}</td>
  <td class="text-sm">{{ st.name }}</td>
  <td class="text-sm">{{ st.phase.name }}</td>
  <td class="text-right font-mono text-sm">${{ st.valor_total_servicio|floatformat:0|intcomma }}</td>
  <td class="text-right text-sm">{{ st.estimated_hours }}</td>
  <td class="text-right text-sm">{{ st.target_margin_pct }}%</td>
  <td>
    {% if st.is_active %}<span class="badge badge-success badge-xs">Activo</span>
    {% else %}<span class="badge badge-ghost badge-xs">Inactivo</span>{% endif %}
  </td>
  <td>
    <button class="btn btn-ghost btn-xs"
            hx-get="{% url 'services:pricing_inline_edit' st.pk %}"
            hx-target="#st-row-{{ st.pk }}"
            hx-swap="outerHTML">
      Editar
    </button>
  </td>
</tr>
