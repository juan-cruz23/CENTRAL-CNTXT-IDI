<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Encuesta de Satisfacción | CNTXT</title>
  <link href="https://cdn.jsdelivr.net/npm/daisyui@5/themes.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/daisyui@5/full.css" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-base-200 flex items-center justify-center p-4">
  <div class="card bg-base-100 shadow-xl w-full max-w-lg">
    <div class="card-body">
      <h1 class="text-2xl font-bold text-center mb-2">Encuesta de Satisfacción</h1>
      <p class="text-center text-base-content/60 mb-6">CNTXT Casa de Diseño</p>
      <form method="post">
        {% csrf_token %}
        {% for field in form %}
        <div class="form-control mb-4">
          <label class="label"><span class="label-text">{{ field.label }}</span></label>
          {{ field }}
          {% if field.help_text %}<span class="text-sm text-base-content/60 mt-1">{{ field.help_text }}</span>{% endif %}
          {% if field.errors %}<span class="text-error text-sm">{{ field.errors.0 }}</span>{% endif %}
        </div>
        {% endfor %}
        <button type="submit" class="btn btn-primary w-full mt-4">Enviar Encuesta</button>
      </form>
    </div>
  </div>
</body>
</html>
