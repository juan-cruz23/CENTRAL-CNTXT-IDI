name: Deploy to Cloud Run

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

on:
  workflow_dispatch:

env:
  PROJECT_ID: appsindunnova
  REGION: us-central1
  SERVICE_NAME: contexto
  JOB_NAME: contexto-migrate
  REGISTRY: us-central1-docker.pkg.dev
  IMAGE_NAME: us-central1-docker.pkg.dev/appsindunnova/cloud-run-source-deploy/contexto
  CLOUD_SQL_INSTANCE: appsindunnova:us-central1:postgres-consolidated

jobs:
  deploy:
    name: Build, Migrate & Deploy
    runs-on: self-hosted

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Google Auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGISTRY }} --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Docker image
        uses: docker/build-push-action@v5
        with:
          platforms: linux/amd64
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }},${{ env.IMAGE_NAME }}:latest
          cache-from: type=registry,ref=${{ env.IMAGE_NAME }}:cache
          cache-to: type=registry,ref=${{ env.IMAGE_NAME }}:cache,mode=max,image-manifest=true

      - name: Create env-vars file
        run: |
          cat > /tmp/env-vars.yaml << EOF
          DJANGO_SETTINGS_MODULE: "config.settings.production"
          DEBUG: "False"
          ALLOWED_HOSTS: "*"
          CSRF_TRUSTED_ORIGINS: "https://*.run.app"
          SECURE_SSL_REDIRECT: "False"
          DB_NAME: "contexto_db"
          DB_USER: "postgres"
          DB_HOST: "/cloudsql/${{ env.CLOUD_SQL_INSTANCE }}"
          DB_PORT: "5432"
          DB_PASSWORD: "${{ secrets.DB_PASSWORD }}"
          SECRET_KEY: "${{ secrets.DJANGO_SECRET_KEY }}"
          TIME_ZONE: "America/Bogota"
          GOOGLE_CLOUD_PROJECT: "appsindunnova"
          GS_BUCKET_NAME: "contexto-media"
          EOF
          sed -i.bak 's/^          //' /tmp/env-vars.yaml && rm -f /tmp/env-vars.yaml.bak

      - name: Run Migrations
        run: |
          gcloud run jobs deploy ${{ env.JOB_NAME }} \
            --image ${{ env.IMAGE_NAME }}:${{ github.sha }} \
            --region ${{ env.REGION }} \
            --tasks 1 \
            --env-vars-file=/tmp/env-vars.yaml \
            --set-cloudsql-instances ${{ env.CLOUD_SQL_INSTANCE }} \
            --command "python" \
            --args "manage.py,migrate,--noinput" \
            --quiet

          gcloud run jobs execute ${{ env.JOB_NAME }} \
            --region ${{ env.REGION }} \
            --wait

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image ${{ env.IMAGE_NAME }}:${{ github.sha }} \
            --region ${{ env.REGION }} \
            --platform managed \
            --allow-unauthenticated \
            --add-cloudsql-instances ${{ env.CLOUD_SQL_INSTANCE }} \
            --env-vars-file=/tmp/env-vars.yaml \
            --memory 512Mi \
            --cpu 1 \
            --timeout 300 \
            --min-instances 0 \
            --max-instances 10 \
            --quiet

      - name: Get Service URL
        run: |
          URL=$(gcloud run services describe ${{ env.SERVICE_NAME }} --region=${{ env.REGION }} --format='value(status.url)')
          echo "## Deployment Complete!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Service URL:** $URL" >> $GITHUB_STEP_SUMMARY
